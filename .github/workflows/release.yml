name: Build Release Binaries

on:
  push:
    tags:
      - 'v*' # Запускается автоматически при создании тега (например, v1.0.0)

jobs:
  build:
    name: Build for ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            ext: ""
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: ".exe"
          - os: darwin
            arch: amd64
            runner: macos-latest
            ext: ""
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o dccag-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dccag-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
